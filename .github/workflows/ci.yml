# CI gate for weeon-teachers (teacher web).
# Blocks merge on: lint · typecheck · tests (when present) · build (when env present).
# Test runner introduced per docs/testing.md §15 (QA-3).
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npx next typegen && npm run typecheck --if-present
      - name: Unit & component tests
        run: npm run test --if-present
      - name: Build
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run build
