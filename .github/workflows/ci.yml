# CI gate for weeon-teachers (teacher web).
# Blocks merge on: lint · typecheck · tests (when present) · build (when env present).
# Test runner introduced per docs/testing.md §15 (QA-3).
# e2e — Playwright journeys (docs/testing.md §7, QA-6); auth-backed specs skip
# unless E2E_* secrets are configured.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The app reads the unprefixed names (src/lib/supabase/env.ts); keep the
      # NEXT_PUBLIC_ aliases for anything that expects them.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npx next typegen && npm run typecheck --if-present
      - name: Unit & component tests + coverage floor
        run: npm run test:coverage --if-present
      - name: Build
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run build

  # Playwright journeys (docs/testing.md §7). Public smoke always runs;
  # credential-gated journeys skip unless E2E_* are set.
  #
  # On pull requests we smoke the *deployed preview* when its URL is provided
  # (PREVIEW_URL, wired from the Deploy workflow or set by hand). Otherwise the
  # suite starts a local dev server, which proves the code but not the deploy.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEACHER_USERNAME: ${{ secrets.E2E_TEACHER_USERNAME }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
      E2E_CLASS_ID: ${{ secrets.E2E_CLASS_ID }}
      E2E_ASSESSMENT_ID: ${{ secrets.E2E_ASSESSMENT_ID }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E journeys
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
