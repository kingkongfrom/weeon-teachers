# Deploy to Vercel (DEP-1)
#
# One workflow for every Next app: a preview deployment on each pull request with
# the URL commented on the PR, and a production deployment from main/master.
#
# Requires three repository secrets (Settings -> Secrets -> Actions):
#   VERCEL_TOKEN       account token (vercel.com/account/tokens)
#   VERCEL_ORG_ID      from .vercel/project.json -> orgId   (fallback below)
#   VERCEL_PROJECT_ID  from .vercel/project.json -> projectId (fallback below)
#
# Until VERCEL_TOKEN exists the job is skipped, so forks and unconfigured repos
# stay green. Copy this file verbatim into the other Next repos; the fallback
# ids below are the ones committed in .vercel/project.json.

name: Deploy

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never deploy from forks (no access to secrets) and never without a token.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_XFJK628QAw0dGkjhE2VZYGHi' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_IRBM9wKAwTIRdN7KLzxAX67mw4U3' }}
    steps:
      - name: Skip without a token
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not configured - skipping deploy (see docs/testing.md)."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=$VERCEL_TOKEN

      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=$VERCEL_TOKEN

      - name: Deploy
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"

      # The preview URL is what the Playwright smoke runs against.
      - name: Comment preview URL on the PR
        if: env.VERCEL_TOKEN != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${url}\n\nSmoke tests: \`E2E_BASE_URL=${url}\`.`,
            });
